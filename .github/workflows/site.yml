# 毎朝 YouTube の最新動画を取ってきて、サイトを作り直して公開する。
# site.json などを GitHub に上げたときも、同じ流れですぐ公開される。
name: サイトを公開

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'   # 毎朝 6:17(日本時間)。UTCで書く決まり
  workflow_dispatch:         # Actions の画面から手動でも動かせる

permissions:
  contents: write   # 最新動画の記録(data/videos.json)を保存するため
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 最新動画を取得してページを作る
        run: python build_site.py --fetch
      - name: 動画の記録が変わっていれば保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "最新動画を更新"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
